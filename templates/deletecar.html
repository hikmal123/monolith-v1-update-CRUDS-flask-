{% include 'header.html' %}
  <body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <h1>{{appType}}  | Car Project</h1>
                <h3>Demo:
                        <a href="{{url_for('createcar')}}">Create</a>
                        /
                        <a href="{{url_for('readcar')}}">Read</a>
                        /
                        <a href="{{url_for('deletecar')}}">Delete</a>
                        /
                        <a href="{{url_for('searchcar')}}">Search</a>
                </h3> 
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-md-12">
                <h4>Delete Car Data</h4>
                <table class="table">
                  <thead>
                    <tr>
                      <th scope="col">ID</th>
                      <th scope="col">Name</th>
                      <th scope="col">Brand</th>
                      <th scope="col">Model</th>
                      <th scope="col">Price (USD)</th>
                      <th scope="col">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                  {% for data in rows %}  
                    <tr>
                      <td>{{data.id}}</td>
                      <td>{{data.carname}}</td>   
                      <td>{{data.carbrand}}</td>
                      <td>{{data.carmodel}}</td>
                      <td>{{data.carprice}}</td>
                      <td>
                          <form action="{{url_for('deletecarsave')}}" method="POST" style="margin:0;">
                              <input type="hidden" name="carName" value="{{data.carname}}">
                              <button type="submit" class="btn btn-sm btn-danger" style="margin-top: 0; padding: 6px 12px; border-radius: 8px; background: #ef4444; border: none; color: white;">Delete</button>
                          </form>
                      </td>
                    </tr>
                  {% endfor %}
                  </tbody>
                </table>
            </div>
            
        </div>
    </div>
  </body>
{% include 'footer.html' %}
