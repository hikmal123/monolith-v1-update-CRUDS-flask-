{% include 'header.html' %}
  <body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <h1>{{appType}} | Car Project</h1>
                <h3>Demo:
                        <a href="{{url_for('createcar')}}">Create</a>
                        /
                        <a href="{{url_for('readcar')}}">Read</a>
                        /
                        <a href="{{url_for('deletecar')}}">Delete</a>
                        /
                        <a href="{{url_for('searchcar')}}">Search</a>
                </h3> 
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-md-12">
                <h4>Update Car Data</h4>
                <form role="form" action="{{url_for('updatecarsave')}}" method="POST" >
                    {% if car %}
                    <input type="hidden" name="oldName" value="{{ car.carname }}">
                    {% endif %}
                    <div class="form-group">
                        <label for="carName">
                            Name
                        </label>
                        <input type="text" class="form-control" id="carName" name="carName" value="{{ car.carname if car else '' }}" required>
                    </div>

                    <div class="form-group">
                    <label for="carBrand">
                         Brand
                        </label>
                        <input type="text" class="form-control" id="carBrand" name='carBrand' value="{{ car.carbrand if car else '' }}">
                    </div>

                    <div class="form-group">
                        <label for="carModel">
                            Model
                        </label>
                        <input type="text" class="form-control" id="carModel" name="carModel" value="{{ car.carmodel if car else '' }}">
                    </div>

                    <div class="form-group">
                        <label for="carPrice">
                            Price
                        </label>
                        <input type="number" min="0" class="form-control" id="carPrice" name="carPrice" value="{{ car.carprice if car else '' }}" required>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Update
                    </button>
                </form>
            </div>
            
        </div>
    </div>
  </body>
{% include 'footer.html' %}
